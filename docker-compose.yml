version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: school-warehouse-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_warehouse

    ports:
      - "5432:5432"

    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data